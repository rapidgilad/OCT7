name: CI

on:
  push:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  GODOT_VERSION: 4.5.1

jobs:
  sim:
    name: Simulation tests + determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Format check
        run: dotnet format whitespace OCT7.sln --verify-no-changes

      - name: Unit tests
        run: dotnet test tests/OCT7.Sim.Tests -c Release

      - name: Full AI-vs-AI skirmishes, all matchups (finish + determinism)
        run: dotnet run --project tools/MatchRunner -c Release -- --all-matchups --matches 2 --verify-determinism

  godot:
    name: Godot build + headless smoke test
    runs-on: ubuntu-latest
    needs: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot .NET
        run: |
          curl -fsSL --retry 4 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build game assembly
        run: dotnet build game/OCT7.Game.csproj

      - name: Import project
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Smoke test (600 ticks, AI vs AI)
        run: timeout 120 "$GODOT" --headless --path game -- --smoke-test 600
